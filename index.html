<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Liptoi is a slow-burn gyroscope dodging game rendered with Ratatui and Ratzilla."
    />
    <meta name="theme-color" content="#03070c" />
    <link data-trunk rel="rust" data-bin="liptoi" data-wasm-opt="z" />
    <link data-trunk rel="copy-file" href="favicon.svg" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Liptoi // Tilt Through the Fever</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "SFMono-Regular", "Cascadia Code", "Roboto Mono", "DejaVu Sans Mono",
          monospace;
        background: #03070c;
        color: #cee7f1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at 50% 42%, rgba(18, 70, 94, 0.2), transparent 46%),
          linear-gradient(rgba(34, 211, 238, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.025) 1px, transparent 1px),
          #03070c;
        background-size: auto, 24px 24px, 24px 24px, auto;
      }

      #terminal-shell {
        position: relative;
        min-height: 0;
        display: grid;
        place-items: center;
      }

      #terminal {
        width: min(100%, 1480px);
        height: min(100%, 860px);
        min-height: 260px;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        filter: drop-shadow(0 0 22px rgba(34, 211, 238, 0.08));
      }

      #terminal > div {
        outline: none;
      }

      #terminal canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        margin: auto;
        outline: none;
      }

      pre {
        margin: 0;
        padding: 0;
        font: inherit;
        font-size: clamp(10px, 1.05vw, 16px);
        line-height: 1.15;
        white-space: pre;
      }

      #boot-screen {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 0.65rem;
        color: #48677c;
        text-align: center;
        letter-spacing: 0.12em;
      }

      #boot-screen strong {
        color: #22d3ee;
        font-size: clamp(1.2rem, 3vw, 2rem);
        font-weight: 700;
      }

      #control-dock {
        min-height: 48px;
        display: flex;
        align-items: end;
        justify-content: center;
        gap: 12px;
        padding-top: 8px;
      }

      button {
        appearance: none;
        border: 1px solid #1e597e;
        border-radius: 0;
        padding: 0.72rem 1rem;
        background: rgba(5, 17, 27, 0.96);
        color: #cee7f1;
        font: 700 0.76rem/1 "SFMono-Regular", "Cascadia Code", monospace;
        letter-spacing: 0.08em;
        cursor: pointer;
        box-shadow: 3px 3px 0 #0b2535;
      }

      button:hover,
      button:focus-visible {
        border-color: #22d3ee;
        color: #7dd3fc;
        outline: 1px solid #22d3ee;
        outline-offset: 3px;
      }

      button:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 #0b2535;
      }

      button:disabled {
        cursor: wait;
        color: #48677c;
      }

      [hidden] {
        display: none !important;
      }

      .privacy-note {
        align-self: center;
        color: #48677c;
        font-size: 0.62rem;
        letter-spacing: 0.04em;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 700px) {
        body {
          padding-right: max(4px, env(safe-area-inset-right));
          padding-left: max(4px, env(safe-area-inset-left));
        }

        #terminal {
          width: 100%;
          min-height: 220px;
        }

        pre {
          font-size: clamp(7px, 2.18vw, 11px);
          line-height: 1.1;
        }

        .privacy-note {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #terminal {
          filter: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="terminal-shell" aria-label="Liptoi game terminal">
      <div id="terminal" role="application" aria-describedby="game-instructions"></div>
      <div id="boot-screen" aria-live="polite">
        <strong>L I P T O I</strong>
        <span>assembling tunnel signal…</span>
      </div>
    </main>
    <div id="control-dock">
      <button id="motion-start" type="button" disabled>INITIALIZING WASM…</button>
      <button id="recenter" type="button" hidden>RECENTER TILT</button>
      <span class="privacy-note">orientation stays in this tab // no network telemetry</span>
    </div>
    <p id="game-instructions" class="sr-only">
      Tilt your phone, drag on the playfield, or use WASD and arrow keys to move the sphere through
      approaching openings. Press R to recenter motion controls.
    </p>
    <script type="module">
      const startButton = document.querySelector("#motion-start");
      const recenterButton = document.querySelector("#recenter");
      const bootScreen = document.querySelector("#boot-screen");

      const sendMotionStatus = (status) => {
        window.dispatchEvent(new CustomEvent("liptoi-motion-status", { detail: status }));
      };

      const focusTerminal = () => {
        document.querySelector("#terminal [tabindex]")?.focus({ preventScroll: true });
      };

      startButton.addEventListener("click", async () => {
        startButton.disabled = true;
        startButton.textContent = "REQUESTING SENSOR…";
        let status = "unsupported";

        if ("DeviceOrientationEvent" in window) {
          const requestPermission = window.DeviceOrientationEvent.requestPermission;
          if (typeof requestPermission === "function") {
            try {
              status = await requestPermission.call(window.DeviceOrientationEvent);
            } catch (_error) {
              status = "denied";
            }
          } else {
            status = "granted";
          }
        }

        sendMotionStatus(status);
        startButton.hidden = true;
        recenterButton.hidden = status !== "granted";
        focusTerminal();
      });

      recenterButton.addEventListener("click", () => {
        window.dispatchEvent(new Event("liptoi-recenter"));
        recenterButton.textContent = "TILT RECENTERED";
        window.setTimeout(() => {
          recenterButton.textContent = "RECENTER TILT";
        }, 900);
        focusTerminal();
      });

      window.addEventListener("TrunkApplicationStarted", () => {
        bootScreen.hidden = true;
        startButton.disabled = false;
        startButton.textContent =
          "DeviceOrientationEvent" in window ? "ARM MOTION + START" : "START WITH TOUCH / KEYS";
      });
    </script>
  </body>
</html>
