name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: trunk@0.21.14

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint native targets
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test simulation and layouts
        run: cargo test --all-targets --locked

      - name: Lint browser target
        run: cargo clippy --target wasm32-unknown-unknown --all-features --locked -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Build release website
        run: trunk build --release
