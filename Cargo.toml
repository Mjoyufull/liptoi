[package]
name = "liptoi"
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
authors = ["Mjoyufull"]
description = "A slow-burn gyroscope dodging game rendered by Ratatui in the browser"
repository = "https://github.com/Mjoyufull/liptoi"
readme = "README.md"
license = "MIT"
keywords = ["game", "gyroscope", "ratatui", "ratzilla", "webassembly"]
categories = ["games", "wasm"]
publish = false

[dependencies]
ratatui = { version = "=0.30.2", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
critical-section = { version = "1.2.0", features = ["std"] }
ratzilla = "=0.3.1"
wasm-bindgen = "0.2.104"
web-sys = { version = "0.3.81", features = [
    "CustomEvent",
    "DeviceOrientationEvent",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "Performance",
    "PointerEvent",
    "Screen",
    "ScreenOrientation",
    "Storage",
    "Window",
] }


[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
